# Scenario: one CMAN replica with generated rules and the CMAN REST API enabled.
#
# REST API is valid only in generated config mode. Create the Secret before
# applying this manifest:
#
#   kubectl create secret generic cman-rest-secret -n default \
#     --from-literal=RESTpwdsecret='<rest-password>' \
#     --from-literal=RESTkeysecret='<rest-private-key>'
#
# Replace the image, subnet OCID, namespace, backend host, and rule values for
# your environment.
apiVersion: network.oracle.com/v4
kind: TrafficManager
metadata:
  name: cman-tm-rest
  namespace: default
spec:
  type: cman
  runtime:
    image: "<cman-container-image>"
    imagePullPolicy: Always
    replicas: 1
  service:
    internal:
      enabled: true
      ports:
        - name: cman
          port: 1521
          targetPort: 1521
    external:
      enabled: true
      serviceType: LoadBalancer
      externalTrafficPolicy: Local
      annotations:
        oci.oraclecloud.com/load-balancer-type: "nlb"
        oci-network-load-balancer.oraclecloud.com/internal: "true"
        oci-network-load-balancer.oraclecloud.com/is-preserve-source: "false"
        oci-network-load-balancer.oraclecloud.com/subnet: "<subnet-ocid>"
      ports:
        - name: cman
          port: 1521
          targetPort: 1521
  cman:
    logLevel: user
    traceLevel: user
    registrationInvitedNodes: "*"
    rules:
      - host: sidb-sample.default.svc.cluster.local
        src: "*"
        dst: "*"
        srv: apppdb1
        action: accept
    restApi:
      enabled: true
      port: 1525
      passwordSecretRef:
        name: cman-rest-secret
        key: RESTpwdsecret
      privateKeySecretRef:
        name: cman-rest-secret
        key: RESTkeysecret
